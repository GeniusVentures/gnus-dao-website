name: CI Pipeline - Hybrid (Native + DevContainer)

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Execution mode (native|devcontainer|hybrid)'
        required: false
        default: 'hybrid'
        type: choice
        options:
          - native
          - devcontainer
          - hybrid
      test_networks:
        description: 'Comma-separated list of networks to test (default: hardhat,sepolia)'
        required: false
        default: 'hardhat,sepolia'
        type: string
      skip_coverage:
        description: 'Skip test coverage analysis'
        required: false
        default: false
        type: boolean

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXECUTION_MODE: ${{ github.event.inputs.execution_mode || 'hybrid' }}
  NODE_VERSION: '22.19.0'
  HARDHAT_CACHE_DIR: ~/.hardhat/cache
  YARN_CACHE_DIR: ~/.yarn/cache
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Determine execution strategy
  execution-strategy:
    name: Determine Execution Strategy
    runs-on: ubuntu-latest
    outputs:
      use_devcontainer: ${{ steps.strategy.outputs.use_devcontainer }}
      use_native: ${{ steps.strategy.outputs.use_native }}
      primary_mode: ${{ steps.strategy.outputs.primary_mode }}

    steps:
      - name: Determine execution strategy
        id: strategy
        run: |
          mode="${{ env.EXECUTION_MODE }}"

          case "$mode" in
            native)
              echo "use_devcontainer=false" >> $GITHUB_OUTPUT
              echo "use_native=true" >> $GITHUB_OUTPUT
              echo "primary_mode=native" >> $GITHUB_OUTPUT
              ;;
            devcontainer)
              echo "use_devcontainer=true" >> $GITHUB_OUTPUT
              echo "use_native=false" >> $GITHUB_OUTPUT
              echo "primary_mode=devcontainer" >> $GITHUB_OUTPUT
              ;;
            hybrid)
              echo "use_devcontainer=true" >> $GITHUB_OUTPUT
              echo "use_native=true" >> $GITHUB_OUTPUT
              echo "primary_mode=devcontainer" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "use_devcontainer=true" >> $GITHUB_OUTPUT
              echo "use_native=true" >> $GITHUB_OUTPUT
              echo "primary_mode=devcontainer" >> $GITHUB_OUTPUT
              ;;
          esac

  # Security and dependency checks (Native)
  security-check-native:
    name: Security & Dependencies (Native)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: execution-strategy
    if: needs.execution-strategy.outputs.use_native == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies (frozen lockfile)
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Run security checks
        run: yarn security-check
        continue-on-error: false

      - name: Audit dependencies
        run: yarn audit --groups dependencies --audit-level moderate
        continue-on-error: true

      - name: Check for dependency changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Checking for dependency changes in PR..."
            git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -E "(package\.json|yarn\.lock)" || echo "No dependency changes detected"
          fi

  # Build and compile (Native)
  build-native:
    name: Build & Compile (Native)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [execution-strategy, security-check-native]
    if: needs.execution-strategy.outputs.use_native == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies (frozen lockfile)
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Setup Hardhat cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HARDHAT_CACHE_DIR }}
          key: hardhat-native-${{ runner.os }}-${{ hashFiles('hardhat.config.ts', 'contracts/**/*.sol') }}
          restore-keys: |
            hardhat-native-${{ runner.os }}-

      - name: Clean previous builds
        run: yarn clean

      - name: Compile contracts
        run: yarn compile

      - name: Generate Diamond ABI
        run: yarn diamond:generate-abi

      - name: Generate TypeChain types
        run: yarn diamond:generate-abi-typechain

      - name: Build TypeScript
        run: npx tsc --noEmit

      - name: Validate Diamond configuration
        run: |
          if [ ! -f "diamonds/GNUSDAODiamond/gnusdaodiamond.config.json" ]; then
            echo "❌ Diamond configuration file not found"
            exit 1
          fi
          echo "✅ Diamond configuration validated"

      - name: Upload build artifacts (Native)
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-native
          path: |
            artifacts/
            diamond-abi/
            diamond-typechain-types/
            typechain-types/
          retention-days: 30

  # Build DevContainer image (only when needed)
  build-devcontainer-image:
    name: Build DevContainer Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: execution-strategy
    if: needs.execution-strategy.outputs.use_devcontainer == 'true'
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push DevContainer image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max
          build-args: |
            NODE_VERSION=22
            PYTHON_VERSION=3.11
          platforms: linux/amd64
          provenance: true
          sbom: true

      - name: Generate container image attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Security and dependency checks (DevContainer)
  security-check-devcontainer:
    name: Security & Dependencies (DevContainer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [execution-strategy, build-devcontainer-image]
    if: needs.execution-strategy.outputs.use_devcontainer == 'true'
    container:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        NODE_ENV: development
        CI_MODE: true
        SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_CLI_API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Run security checks
        run: yarn security-check
        continue-on-error: false

      - name: Audit dependencies
        run: yarn audit --groups dependencies --audit-level moderate
        continue-on-error: true

      - name: Check for dependency changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Checking for dependency changes in PR..."
            git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -E "(package\.json|yarn\.lock)" || echo "No dependency changes detected"
          fi

  # Build and compile (DevContainer)
  build-devcontainer:
    name: Build & Compile (DevContainer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [execution-strategy, build-devcontainer-image, security-check-devcontainer]
    if: needs.execution-strategy.outputs.use_devcontainer == 'true'
    container:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        NODE_ENV: development
        CI_MODE: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Setup Hardhat cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HARDHAT_CACHE_DIR }}
          key: hardhat-devcontainer-${{ runner.os }}-${{ hashFiles('hardhat.config.ts', 'contracts/**/*.sol') }}

      - name: Clean previous builds
        run: yarn clean

      - name: Compile contracts
        run: yarn compile

      - name: Generate Diamond ABI
        run: yarn diamond:generate-abi

      - name: Generate TypeChain types
        run: yarn diamond:generate-abi-typechain

      - name: Build TypeScript
        run: npx tsc --noEmit

      - name: Validate Diamond configuration
        run: |
          if [ ! -f "diamonds/GNUSDAODiamond/gnusdaodiamond.config.json" ]; then
            echo "❌ Diamond configuration file not found"
            exit 1
          fi
          echo "✅ Diamond configuration validated"

      - name: Upload build artifacts (DevContainer)
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-devcontainer
          path: |
            artifacts/
            diamond-abi/
            diamond-typechain-types/
            typechain-types/
          retention-days: 30

  # Determine which build artifacts to use
  select-build-artifacts:
    name: Select Build Artifacts
    runs-on: ubuntu-latest
    needs: [execution-strategy, build-native, build-devcontainer]
    outputs:
      artifact_name: ${{ steps.select.outputs.artifact_name }}

    steps:
      - name: Select primary build artifacts
        id: select
        run: |
          if [ "${{ needs.execution-strategy.outputs.primary_mode }}" = "devcontainer" ] && [ "${{ needs.build-devcontainer.result }}" = "success" ]; then
            echo "artifact_name=build-artifacts-devcontainer" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build-native.result }}" = "success" ]; then
            echo "artifact_name=build-artifacts-native" >> $GITHUB_OUTPUT
          else
            echo "❌ No successful build found"
            exit 1
          fi

  # Unit tests (using selected build)
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [execution-strategy, select-build-artifacts]
    strategy:
      matrix:
        node-version: [22.19.0]
        test-group: [unit, integration]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies (frozen lockfile)
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.select-build-artifacts.outputs.artifact_name }}

      - name: Setup Hardhat cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HARDHAT_CACHE_DIR }}
          key: hardhat-${{ runner.os }}-${{ hashFiles('hardhat.config.ts', 'contracts/**/*.sol') }}

      - name: Run ${{ matrix.test-group }} tests
        run: |
          if [ "${{ matrix.test-group }}" = "unit" ]; then
            npx hardhat test test/unit/ --parallel
          elif [ "${{ matrix.test-group }}" = "integration" ]; then
            npx hardhat test test/integration/ --parallel
          fi
        env:
          HARDHAT_PARALLEL: true
          HARDHAT_PARALLEL_MAX_JOBS: 4

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.test-group }}
          path: |
            test-results.xml
            coverage/
          retention-days: 30

  # Performance comparison (when running hybrid mode)
  performance-comparison:
    name: Performance Comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [execution-strategy, build-native, build-devcontainer]
    if: needs.execution-strategy.outputs.use_native == 'true' && needs.execution-strategy.outputs.use_devcontainer == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run performance benchmarks
        run: |
          echo "Running performance comparison between native and DevContainer execution..."
          # This would run the performance benchmarking script
          # For now, just log the comparison opportunity
          echo "Performance comparison would be implemented here"
          echo "Native build time vs DevContainer build time"
          echo "Native test execution vs DevContainer test execution"

      - name: Upload performance comparison report
        uses: actions/upload-artifact@v4
        with:
          name: performance-comparison-report
          path: |
            performance-comparison.json
          retention-days: 30

  # Final validation and summary
  validate:
    name: Final Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [execution-strategy, security-check-native, security-check-devcontainer, build-native, build-devcontainer, test-unit, performance-comparison]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate hybrid pipeline summary
        run: |
          echo "## 🔄 GNUS-DAO-Website Hybrid CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Execution Mode: ${{ env.EXECUTION_MODE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Results:" >> $GITHUB_STEP_SUMMARY

          # Security checks
          if [ "${{ needs.execution-strategy.outputs.use_native }}" = "true" ]; then
            echo "- 🔒 Security Check (Native): ${{ needs.security-check-native.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.execution-strategy.outputs.use_devcontainer }}" = "true" ]; then
            echo "- 🔒 Security Check (DevContainer): ${{ needs.security-check-devcontainer.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          # Build results
          if [ "${{ needs.execution-strategy.outputs.use_native }}" = "true" ]; then
            echo "- 🔨 Build (Native): ${{ needs.build-native.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.execution-strategy.outputs.use_devcontainer }}" = "true" ]; then
            echo "- 🔨 Build (DevContainer): ${{ needs.build-devcontainer.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "- 🧪 Unit Tests: ${{ needs.test-unit.result }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.execution-strategy.outputs.use_native }}" = "true" ] && [ "${{ needs.execution-strategy.outputs.use_devcontainer }}" = "true" ]; then
            echo "- 📊 Performance Comparison: ${{ needs.performance-comparison.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          if [[ ("${{ needs.security-check-native.result }}" == "success" || "${{ needs.security-check-devcontainer.result }}" == "success") && \
                ("${{ needs.build-native.result }}" == "success" || "${{ needs.build-devcontainer.result }}" == "success") && \
                "${{ needs.test-unit.result }}" == "success" ]]; then
            echo "### ✅ Pipeline Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "All critical checks passed. Pipeline completed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Pipeline Status: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "Some checks failed. Please review the logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Execution Strategy:" >> $GITHUB_STEP_SUMMARY
          echo "- **Primary Mode:** ${{ needs.execution-strategy.outputs.primary_mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Native Execution:** ${{ needs.execution-strategy.outputs.use_native == 'true' && 'Enabled ✅' || 'Disabled ❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **DevContainer Execution:** ${{ needs.execution-strategy.outputs.use_devcontainer == 'true' && 'Enabled ✅' || 'Disabled ❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Parallel Execution:** Enabled for both modes" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Selection:** ${{ needs.select-build-artifacts.outputs.artifact_name }}" >> $GITHUB_STEP_SUMMARY