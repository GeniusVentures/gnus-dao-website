# GNUS-DAO-Website Multi-Chain Testing Configuration

# Test Networks Configuration
test_networks:
  - name: sepolia
    chain_id: 11155111
    rpc_env: SEPOLIA_RPC
    block_env: SEPOLIA_BLOCK
    gas_limit: 30000000
    timeout: 120000
    enabled: true

  - name: polygon-amoy
    chain_id: 80002
    rpc_env: POLYGON_AMOY_RPC
    block_env: POLYGON_AMOY_BLOCK
    gas_limit: 30000000
    timeout: 120000
    enabled: true

  - name: arbitrum-sepolia
    chain_id: 421614
    rpc_env: ARBITRUM_SEPOLIA_RPC
    block_env: ARBITRUM_SEPOLIA_BLOCK
    gas_limit: 30000000
    timeout: 120000
    enabled: true

  - name: base-sepolia
    chain_id: 84532
    rpc_env: BASE_SEPOLIA_RPC
    block_env: BASE_SEPOLIA_BLOCK
    gas_limit: 30000000
    timeout: 120000
    enabled: true

# Fork Testing Configuration
fork_tests:
  enabled: true
  test_pattern: "fork"
  parallel_execution: false
  retry_attempts: 2
  retry_delay: 5000

# Deployment Testing Configuration
deployment_tests:
  enabled: true
  test_pattern: "deploy"
  estimate_gas: true
  verify_contracts: false
  save_deployments: true

# Test Execution Settings
test_execution:
  parallel_jobs: 4
  timeout: 60000
  slow_threshold: 10000
  bail_on_first_failure: false
  gas_reporter: true
  coverage: true

# Network-Specific Overrides
network_overrides:
  sepolia:
    gas_price: 20000000000  # 20 gwei
    gas_limit: 8000000

  polygon-amoy:
    gas_price: 40000000000  # 40 gwei
    gas_limit: 8000000

  arbitrum-sepolia:
    gas_price: 100000000    # 0.1 gwei
    gas_limit: 25000000

  base-sepolia:
    gas_price: 100000000    # 0.1 gwei
    gas_limit: 8000000

# Test Categories
test_categories:
  unit:
    enabled: true
    timeout: 30000
    pattern: "test/unit/**/*.ts"

  integration:
    enabled: true
    timeout: 60000
    pattern: "test/integration/**/*.ts"

  deployment:
    enabled: true
    timeout: 120000
    pattern: "test/deployment/**/*.ts"

  fork:
    enabled: true
    timeout: 180000
    pattern: "**/fork*.ts"

# Performance Thresholds
performance_thresholds:
  compile_time_max: 30000      # 30 seconds
  test_time_max: 60000         # 60 seconds
  coverage_min: 80             # 80% minimum
  gas_limit_max: 8000000       # 8M gas
  contract_size_max: 24576     # 24KB (Spurious Dragon limit)

# CI/CD Integration
ci_integration:
  artifact_retention: 30
  cache_enabled: true
  parallel_matrix: true
  fail_fast: false
  notifications: true